<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Riwayat | MyFinance</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-animation">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <div class="dashboard-layout">
      <!-- DEVSTUDIO GLASS NAVBAR -->
      <header class="top-navbar-wrapper">
        <nav class="devstudio-navbar">
          <a href="index.html" class="nav-brand">MyFinance</a>

          <div class="nav-links-center">
            <a href="index.html" class="nav-link">Home</a>
            <a href="transaksi.html" class="nav-link">Transaksi</a>
            <a href="rencana.html" class="nav-link">Rencana</a>
            <a href="riwayat.html" class="nav-link active">Riwayat</a>
          </div>

          <div class="nav-right-btn">
            <button class="btn-get-started" onclick="logout()" title="Keluar dari akun">
              Keluar
            </button>
          </div>

          <button class="nav-hamburger" onclick="toggleMobileMenu()" aria-label="Menu">
            ☰
          </button>

          <div class="mobile-dropdown-menu" id="mobile-menu">
            <a href="index.html" class="mobile-nav-link">Home</a>
            <a href="transaksi.html" class="mobile-nav-link">Transaksi</a>
            <a href="rencana.html" class="mobile-nav-link">Rencana</a>
            <a href="riwayat.html" class="mobile-nav-link active">Riwayat</a>
            <button class="mobile-btn-logout" onclick="logout()">↪ Keluar</button>
          </div>
        </nav>
      </header>
      <main class="main-content">
        <div class="glass-panel table-panel">
          <h3>📋 Riwayat Transaksi</h3>
          <div class="table-wrapper">
            <table>
              <thead>
                <tr>
                  <th>Tanggal</th>
                  <th>Kategori</th>
                  <th>Keterangan</th>
                  <th class="text-right">Nominal</th>
                  <th class="text-center">Aksi</th>
                </tr>
              </thead>
              <tbody id="tabel-transaksi"></tbody>
            </table>
          </div>
        </div>
        <div class="reset-container">
          <button class="btn-reset" onclick="resetData()">
            🔄 Mulai Ulang dari Awal (Reset Data)
          </button>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
