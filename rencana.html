<!doctype html>
<html lang="id">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Rencana | MyFinance</title>
    <link rel="stylesheet" href="style.css" />
    <link
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="bg-animation">
      <div class="orb orb-1"></div>
      <div class="orb orb-2"></div>
      <div class="orb orb-3"></div>
    </div>
    <div class="dashboard-layout">
      <!-- DEVSTUDIO GLASS NAVBAR -->
      <header class="top-navbar-wrapper">
        <nav class="devstudio-navbar">
          <a href="index.html" class="nav-brand">MyFinance</a>

          <div class="nav-links-center">
            <a href="index.html" class="nav-link">Home</a>
            <a href="transaksi.html" class="nav-link">Transaksi</a>
            <a href="rencana.html" class="nav-link active">Rencana</a>
            <a href="riwayat.html" class="nav-link">Riwayat</a>
          </div>

          <div class="nav-right-btn">
            <button class="btn-get-started" onclick="logout()" title="Keluar dari akun">
              Keluar
            </button>
          </div>

          <button class="nav-hamburger" onclick="toggleMobileMenu()" aria-label="Menu">
            ☰
          </button>

          <div class="mobile-dropdown-menu" id="mobile-menu">
            <a href="index.html" class="mobile-nav-link">Home</a>
            <a href="transaksi.html" class="mobile-nav-link">Transaksi</a>
            <a href="rencana.html" class="mobile-nav-link active">Rencana</a>
            <a href="riwayat.html" class="mobile-nav-link">Riwayat</a>
            <button class="mobile-btn-logout" onclick="logout()">↪ Keluar</button>
          </div>
        </nav>
      </header>
      <main class="main-content">
        <div class="glass-panel setup-panel">
          <h3>⚙️ Atur Rencana Keuangan</h3>
          <div class="form-grid-2">
            <div class="input-group">
              <label>Batas Pengeluaran / Bulan (Rp)</label>
              <input type="number" id="set-budget" placeholder="Cth: 1500000" />
              <button class="btn-small" onclick="simpanBudget()">
                Set Budget
              </button>
            </div>
            <div class="input-group">
              <label>Pindahkan Uang ke Tabungan (Rp)</label>
              <input type="number" id="add-goal" placeholder="Cth: 200000" />
              <button class="btn-small bg-blue" onclick="nabung()">
                Nabung Sekarang
              </button>
            </div>
          </div>
        </div>
      </main>
    </div>
    <script src="script.js"></script>
  </body>
</html>
